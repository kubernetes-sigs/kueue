                - name
                type: object
                x-kubernetes-validations:
                - message: only the ClusterQueue kind is allowed for managerSubtreeRootRef
                  rule: self.kind == 'ClusterQueue'
            required:
            - managerSubtreeRootRef
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be no more than 63 characters
          rule: size(self.metadata.name) <= 63
        - message: name must not contain dots
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
