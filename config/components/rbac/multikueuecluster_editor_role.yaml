# permissions for end users to edit multikueueclusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multikueuecluster-editor-role
  labels:
    rbac.kueue.x-k8s.io/role: "multikueuecluster-editor"
    rbac.kueue.x-k8s.io/batch-admin: "true"
rules:
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - multikueueclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - multikueueclusters/status
  verbs:
  - get
