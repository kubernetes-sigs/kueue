# permissions for end users to edit capacitybufferconfigs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capacitybufferconfig-editor-role
  labels:
    rbac.kueue.x-k8s.io/role: "capacitybufferconfig-editor"
    rbac.kueue.x-k8s.io/batch-admin: "true"
rules:
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - capacitybufferconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
