# permissions for end users to view preemptionconfigs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preemptionconfig-viewer-role
  labels:
    rbac.kueue.x-k8s.io/role: "preemptionconfig-viewer"
    rbac.kueue.x-k8s.io/batch-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - preemptionconfigs
  verbs:
  - get
  - list
  - watch
