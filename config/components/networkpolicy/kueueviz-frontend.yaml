---
# Restricts ingress to the KueueViz dashboard frontend.
#
# Inert unless the KueueViz components are also deployed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kueueviz-frontend
  namespace: system
spec:
  podSelector:
    matchLabels:
      app: kueueviz-frontend
  policyTypes:
    - Ingress
  ingress:
    # The ingress controller serves the static dashboard assets from this port,
    # and kubelet probes it. Ingress controllers vary in namespace and labels,
    # so this rule is scoped by port.
    - ports:
        - protocol: TCP
          port: 8080
