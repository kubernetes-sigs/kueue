# This overlay builds the kueue-viz dashboard to be used in combination
# with other overlays.

namespace: kueue-system
namePrefix: kueue-

labels:
  - pairs:
      app.kubernetes.io/name: kueue
      app.kubernetes.io/component: dashboard

resources:
  - ../components/kueueviz/

patches:
# Drop the path-routed Ingress; this overlay exposes each component on its own host.
- path: remove_shared_ingress.yaml
# Add ingress annotations and tls config for nginx backend ingress controller
- path: backend_ingress_patch.yaml
# Add ingress annotations and tls config for nginx frontend ingress controller
- path: frontend_ingress_patch.yaml
# Override frontend env.js ConfigMap with production websocket URL
- path: frontend_configmap_patch.yaml
