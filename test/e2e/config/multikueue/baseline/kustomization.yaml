apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../default

# Baseline tests do not exercise controller failover. Keep cluster setup light
# while the suite compiles alongside the three kind clusters.
replicas:
- name: kueue-controller-manager
  count: 1

configMapGenerator:
- behavior: merge
  files:
  - controller_manager_config.yaml
  name: kueue-manager-config
  namespace: kueue-system
