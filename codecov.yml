# Unit coverage is uploaded by .github/workflows/codecov-prow.yaml from the
# Prow unit-test shards. The workflow merges all shards into one upload per
# commit, so Codecov can report after the first upload.
codecov:
  # Only main may change the YAML that Codecov saves for the repository.
  # Codecov still applies the YAML of the uploaded commit when it has one, so
  # the workflow skips pull requests that have a Codecov YAML path differing
  # from their merge base with main; this is defense in depth.
  strict_yaml_branch: main
  require_ci_to_pass: false
  notify:
    after_n_builds: 1
    # Prow e2e jobs can run for hours; do not hold the report for them.
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: true
  after_n_builds: 1

# Profiles name files by Go import path.
fixes:
  - "sigs.k8s.io/kueue/::"

flags:
  unit:
    carryforward: false

# Keep in sync with the gopherage filter in codecov-prow.yaml (Prow's
# filtered.cov exclusions plus test/).
ignore:
  - "**/zz_generated.*.go"
  - "client-go/**"
  - "internal/mocks/**"
  - "cmd/kueuectl/app/testing/**"
  - "test/**"
