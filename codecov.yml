# Unit coverage is uploaded by .github/workflows/codecov-prow.yaml. Prow merges
# the unit-test shards (hack/testing/merge-unit-coverage.sh) and the workflow
# uploads that one profile, so Codecov can report after the first upload. A
# rerun on the same commit uploads again; Codecov unions a commit's uploads.
# hack/make/test.mk (UNIT_COVERAGE_EXCLUDE) decides which files the profile
# covers.
codecov:
  strict_yaml_branch: main
  require_ci_to_pass: false
  notify:
    after_n_builds: 1
    # Prow e2e jobs can run for hours; do not hold the report for them.
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

# Profiles name files by Go import path.
fixes:
  - "sigs.k8s.io/kueue/::"

flags:
  unit:
    carryforward: false
