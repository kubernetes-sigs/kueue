# Derived from test/integration/singlecluster/scheduler/scheduler_test.go (kueue PR #16728).
name: drain-held-localqueue
description: >-
  An admitted Workload whose LocalQueue is held is evicted with
  ClusterQueueStopped when its ClusterQueue switches to HoldAndDrain.
test: "test/integration/singlecluster/scheduler/scheduler_test.go: Should evict workloads when stop policy is drain and the LocalQueue is held"
namespaces: [pr-evidence]
steps:
  - apply: |
      apiVersion: kueue.x-k8s.io/v1beta2
      kind: ResourceFlavor
      metadata: {name: default}
      ---
      apiVersion: kueue.x-k8s.io/v1beta2
      kind: ClusterQueue
      metadata: {name: cq}
      spec:
        namespaceSelector: {}
        resourceGroups:
        - coveredResources: [cpu]
          flavors:
          - name: default
            resources:
            - {name: cpu, nominalQuota: "5"}
      ---
      apiVersion: kueue.x-k8s.io/v1beta2
      kind: LocalQueue
      metadata: {name: q}
      spec: {clusterQueue: cq}
  - waitFor: {kind: ClusterQueue, name: cq, condition: Active}
  - apply:
      apiVersion: kueue.x-k8s.io/v1beta2
      kind: Workload
      metadata: {name: one}
      spec:
        queueName: q
        podSets:
        - name: main
          count: 1
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: c
                image: registry.k8s.io/pause:3.10
                resources: {requests: {cpu: "1"}}
  - waitFor: {kind: Workload, name: one, condition: Admitted}
  - capture: admitted
  - patch: {kind: LocalQueue, name: q, merge: {spec: {stopPolicy: Hold}}}
  - waitFor: {kind: LocalQueue, name: q, condition: Active, status: "False"}
  - capture: localqueue-held
  - patch: {kind: ClusterQueue, name: cq, merge: {spec: {stopPolicy: HoldAndDrain}}}
  - waitFor: {kind: ClusterQueue, name: cq, condition: Active, status: "False"}
  - waitFor: {kind: Workload, name: one, condition: Evicted, reason: ClusterQueueStopped}
  - finishEviction: {name: one}
  - waitFor: {kind: Workload, name: one, condition: QuotaReserved, status: "False"}
  - capture: drained
