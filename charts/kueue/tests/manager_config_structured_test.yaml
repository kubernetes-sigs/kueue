suite: test structured manager configuration
templates:
  - manager/manager-config.yaml
  - webhook/manifests.yaml
tests:
  - it: should keep sibling defaults when overriding nested fields
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.clientConnection.qps: 600
      managerConfig.structuredOverrides.controller.groupKindConcurrency:
        Job.batch: 8
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "clientConnection:\n  burst: 500\n  qps: 600"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "Job.batch: 8"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "Cohort.kueue.x-k8s.io: 1"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "Workload.kueue.x-k8s.io: 10"

  - it: should preserve false and zero values
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.leaderElection.leaderElect: false
      managerConfig.structuredOverrides.controller.groupKindConcurrency:
        Job.batch: 0
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "leaderElect: false"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "Job.batch: 0"

  - it: should remove an inherited field set to null
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.clientConnection.qps: null
    asserts:
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps:"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "burst: 500"

  - it: should replace the frameworks list
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.integrations.frameworks: [batch/job]
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "integrations:\n  frameworks:\n  - batch/job\n"
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "ray.io/rayjob|kubeflow.org/mpijob|  - pod"

  - it: should allow an empty frameworks list
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.integrations.frameworks: []
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: 'frameworks: \[\]'

  - it: should keep a legacy string as a full replacement
    template: manager/manager-config.yaml
    set:
      managerConfig.controllerManagerConfigYaml: |
        clientConnection:
          qps: 100
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps: 100"
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "burst:|groupKindConcurrency:"

  - it: should disable internal certificates when cert-manager is enabled with structured config
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      enableCertManager: true
      managerConfig.structuredOverrides.clientConnection.qps: 600
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "internalCertManagement:\n  enable: false"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps: 600"

  - it: should preserve explicit internal certificate settings
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      enableCertManager: true
      managerConfig.structuredOverrides.internalCertManagement:
        enable: true
        webhookServiceName: custom-service
        webhookSecretName: custom-secret
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "internalCertManagement:\n  enable: true\n  webhookSecretName: custom-secret\n  webhookServiceName: custom-service"

  - it: should reject a non-map structured config
    template: webhook/manifests.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides: invalid
    asserts:
      - failedTemplate:
          errorPattern: "(?s)managerConfig[/.]structuredOverrides.*(object|map)"

  - it: should propagate the structured selector to the manager and both webhook configurations
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.managedJobsNamespaceSelector:
        matchLabels:
          team: research
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "managedJobsNamespaceSelector:\n  matchLabels:\n    team: research"
        template: manager/manager-config.yaml
      - equal:
          path: webhooks[?(@.name == "mjob.kb.io")].namespaceSelector
          value:
            matchLabels:
              team: research
        template: webhook/manifests.yaml
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vjob.kb.io")].namespaceSelector
          value:
            matchLabels:
              team: research
        template: webhook/manifests.yaml
        documentIndex: 1
      - notExists:
          path: webhooks[?(@.name == "mclusterqueue.kb.io")].namespaceSelector
        template: webhook/manifests.yaml
        documentIndex: 0

  - it: should derive webhook failure policies from the structured frameworks list
    template: webhook/manifests.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.integrations.frameworks: [batch/job, pod]
    asserts:
      - equal:
          path: webhooks[?(@.name == "mpod.kb.io")].failurePolicy
          value: Fail
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vpod.kb.io")].failurePolicy
          value: Fail
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "mdeployment.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0

  - it: should use YAML mode instead of structured configuration for every consumer
    set:
      managerConfig.mode: yaml
      managerConfig.structuredOverrides:
        clientConnection:
          qps: 600
        integrations:
          frameworks: [batch/job, pod]
        managedJobsNamespaceSelector:
          matchLabels:
            team: structured
      managerConfig.controllerManagerConfigYaml: |
        clientConnection:
          qps: 100
        integrations:
          frameworks: [batch/job]
        managedJobsNamespaceSelector:
          matchLabels:
            team: legacy
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps: 100"
        template: manager/manager-config.yaml
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps: 600|burst:|groupKindConcurrency:|team: structured"
        template: manager/manager-config.yaml
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "team: legacy"
        template: manager/manager-config.yaml
      - equal:
          path: webhooks[?(@.name == "mjob.kb.io")].namespaceSelector.matchLabels.team
          value: legacy
        template: webhook/manifests.yaml
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vjob.kb.io")].namespaceSelector.matchLabels.team
          value: legacy
        template: webhook/manifests.yaml
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "mpod.kb.io")].failurePolicy
          value: Ignore
        template: webhook/manifests.yaml
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vpod.kb.io")].failurePolicy
          value: Ignore
        template: webhook/manifests.yaml
        documentIndex: 1

  - it: should use chart defaults when both inputs are empty
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides: {}
      managerConfig.controllerManagerConfigYaml: ""
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "burst: 500"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps: 300"

  - it: should preserve empty legacy configuration without selecting structured defaults
    template: manager/manager-config.yaml
    set:
      managerConfig.controllerManagerConfigYaml: ""
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "internalCertManagement:"
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "apiVersion:|kind:|burst:|qps:"

  - it: should preserve Ignore webhook policies with an empty legacy string
    template: webhook/manifests.yaml
    set:
      managerConfig.controllerManagerConfigYaml: ""
    asserts:
      - equal:
          path: webhooks[?(@.name == "mpod.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0

  - it: should select structured mode without parsing the legacy string
    set:
      managerConfig.mode: structured
      managerConfig.controllerManagerConfigYaml: "not: [valid YAML"
      managerConfig.structuredOverrides:
        clientConnection:
          qps: 600
        integrations:
          frameworks: [batch/job]
        managedJobsNamespaceSelector:
          matchLabels:
            team: structured
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "clientConnection:\n  burst: 500\n  qps: 600"
        template: manager/manager-config.yaml
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "team: structured"
        template: manager/manager-config.yaml
      - equal:
          path: webhooks[?(@.name == "mjob.kb.io")].namespaceSelector.matchLabels.team
          value: structured
        template: webhook/manifests.yaml
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vjob.kb.io")].namespaceSelector.matchLabels.team
          value: structured
        template: webhook/manifests.yaml
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "mpod.kb.io")].failurePolicy
          value: Ignore
        template: webhook/manifests.yaml
        documentIndex: 0

  - it: should render an empty legacy YAML object without adding configuration defaults
    template: manager/manager-config.yaml
    set:
      managerConfig.controllerManagerConfigYaml: "{}"
      managerConfig.structuredOverrides.clientConnection.qps: 600
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "internalCertManagement:"
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "apiVersion:|kind:|clientConnection:|integrations:|leaderElection:|controller:"

  - it: should ignore optional framework webhooks for an empty legacy YAML object
    template: webhook/manifests.yaml
    set:
      managerConfig.controllerManagerConfigYaml: "{}"
    asserts:
      - equal:
          path: webhooks[?(@.name == "mpod.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "mdeployment.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "mstatefulset.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vpod.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "vdeployment.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "vstatefulset.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1

  - it: should ignore optional framework webhooks when integrations are removed
    template: webhook/manifests.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.integrations: null
    asserts:
      - equal:
          path: webhooks[?(@.name == "mpod.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "mdeployment.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "mstatefulset.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vpod.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "vdeployment.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "vstatefulset.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1

  - it: should ignore optional framework webhooks when frameworks are removed
    template: webhook/manifests.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides.integrations.frameworks: null
    asserts:
      - equal:
          path: webhooks[?(@.name == "mpod.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "mdeployment.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "mstatefulset.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 0
      - equal:
          path: webhooks[?(@.name == "vpod.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "vdeployment.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1
      - equal:
          path: webhooks[?(@.name == "vstatefulset.kb.io")].failurePolicy
          value: Ignore
        documentIndex: 1

  - it: should use packaged defaults with an empty structured map
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides: {}
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "burst: 500"
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps: 300"

  - it: should reject a null structured input
    template: webhook/manifests.yaml
    set:
      managerConfig.mode: structured
      managerConfig.structuredOverrides: null
    asserts:
      - failedTemplate:
          errorPattern: "(?s)managerConfig[/.]structuredOverrides.*(object|map)"

  - it: should reject an unknown manager configuration input
    template: manager/manager-config.yaml
    set:
      managerConfig.mode: structured
      managerConfig.confg: {}
    asserts:
      - failedTemplate:
          errorPattern: "(?s)managerConfig.*confg.*not allowed"

  - it: should reject a non-string legacy input
    template: webhook/manifests.yaml
    set:
      managerConfig.controllerManagerConfigYaml: {}
    asserts:
      - failedTemplate:
          errorPattern: "(?s)controllerManagerConfigYaml.*string"

  - it: should reject a null legacy input
    template: webhook/manifests.yaml
    set:
      managerConfig.controllerManagerConfigYaml: null
    asserts:
      - failedTemplate:
          errorPattern: "(?s)controllerManagerConfigYaml.*string"
