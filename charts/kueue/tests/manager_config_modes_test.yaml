suite: test explicit manager configuration modes
templates:
  - manager/manager-config.yaml
tests:
  - it: should use legacy chart defaults when mode is absent
    asserts: &chartDefaults
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "clientConnection:\n  burst: 500\n  qps: 300"

  - it: should ignore structured overrides without opting in
    set:
      managerConfig.structuredOverrides.clientConnection.qps: 600
    asserts: *chartDefaults

  - it: should ignore valid unused structured overrides in legacy mode
    set:
      managerConfig.structuredOverrides: {}
    asserts: *chartDefaults

  - it: should use packaged defaults in explicit yaml mode when the YAML key is absent
    set:
      managerConfig.mode: yaml
      managerConfig.structuredOverrides.clientConnection.qps: 600
    asserts: *chartDefaults

  - it: should preserve a supplied YAML string without a mode
    set: &legacyValues
      managerConfig.controllerManagerConfigYaml: |
        clientConnection:
          qps: 123
      managerConfig.structuredOverrides.clientConnection.qps: 600
    asserts: &legacyReplacement
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "qps: 123"
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "burst:|qps: 600"

  - it: should select legacy configuration when switching back to yaml mode
    set:
      <<: *legacyValues
      managerConfig.mode: yaml
    asserts: *legacyReplacement

  - it: should preserve an empty YAML string in explicit yaml mode
    set:
      managerConfig.mode: yaml
      managerConfig.controllerManagerConfigYaml: ""
      managerConfig.structuredOverrides.clientConnection.qps: 600
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "internalCertManagement:"
      - notMatchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "apiVersion:|clientConnection:|integrations:"

  - it: should use structured defaults when only the mode is specified
    set:
      managerConfig.mode: structured
    asserts: *chartDefaults

  - it: should ignore a retained legacy string in structured mode
    set:
      <<: *legacyValues
      managerConfig.mode: structured
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "clientConnection:\n  burst: 500\n  qps: 600"

  - it: should reject a non-string legacy value even in structured mode
    set:
      managerConfig.mode: structured
      managerConfig.controllerManagerConfigYaml: 123
    asserts:
      - failedTemplate:
          errorPattern: "(?s)controllerManagerConfigYaml.*string"

  - it: should reject an unknown mode
    set:
      managerConfig.mode: invalid
    asserts: &invalidMode
      - failedTemplate:
          errorPattern: "(?s)mode.*(yaml|structured|string)"

  - it: should reject an empty mode
    set:
      managerConfig.mode: ""
    asserts: *invalidMode

  - it: should reject a null mode
    set:
      managerConfig.mode: null
    asserts: *invalidMode

  - it: should reject a non-string mode
    set:
      managerConfig.mode: true
    asserts: *invalidMode

  - it: should reject an unknown manager input with mode absent
    set:
      managerConfig.typo: {}
    asserts:
      - failedTemplate:
          errorPattern: "(?s)managerConfig.*typo.*not allowed"

  - it: should reject non-map overrides with mode absent
    set:
      managerConfig.structuredOverrides: invalid
    asserts:
      - failedTemplate:
          errorPattern: "(?s)structuredOverrides.*object"

  - it: should reject an unknown manager input with mode yaml
    set:
      managerConfig.mode: yaml
      managerConfig.typo: {}
    asserts:
      - failedTemplate:
          errorPattern: "(?s)managerConfig.*typo.*not allowed"

  - it: should reject non-map overrides with mode yaml
    set:
      managerConfig.mode: yaml
      managerConfig.structuredOverrides: invalid
    asserts:
      - failedTemplate:
          errorPattern: "(?s)structuredOverrides.*object"

  - it: should reject non-string YAML in explicit yaml mode
    set:
      managerConfig.mode: yaml
      managerConfig.controllerManagerConfigYaml: 123
    asserts:
      - failedTemplate:
          errorPattern: "(?s)controllerManagerConfigYaml.*string"
