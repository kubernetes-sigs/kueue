apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kueue.fullname" . }}-controller-manager
  namespace: '{{ .Release.Namespace }}'
  labels:
  {{- include "kueue.controllerManager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controllerManager.replicas }}
  {{- with .Values.controllerManager.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
    {{- include "kueue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
      {{- include "kueue.selectorLabels" . | nindent 8 }}
      annotations:
        charts.kueue.x-k8s.io/config-checksum: {{ include (print .Template.BasePath "/manager/manager-config.yaml") . | sha256sum }}
        kubectl.kubernetes.io/default-container: manager
        {{- if .Values.controllerManager.manager.podAnnotations }}
        {{- toYaml .Values.controllerManager.manager.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      {{- with  .Values.controllerManager.manager.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controllerManager.hostNetwork }}
      hostNetwork: {{ . }}
      {{- end }}
      {{- with .Values.controllerManager.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      containers:
      - args:
        - --config=/controller_manager_config.yaml
        - --zap-log-level={{ .Values.controllerManager.manager.logLevel }}
        {{- include "kueue.featureGates" . | indent 8 }}
        command:
        - /manager
        image: "{{ .Values.controllerManager.manager.image.repository }}:{{ .Values.controllerManager.manager.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.controllerManager.manager.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          {{- with .Values.controllerManager.livenessProbe }}
          {{- . | toYaml | nindent 10 }}
          {{- end }}
        name: manager
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
        - containerPort: 8082
          name: visibility
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          {{- with .Values.controllerManager.readinessProbe }}
          {{- . | toYaml | nindent 10 }}
          {{- end }}
        resources:
          {{- toYaml .Values.controllerManager.manager.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.controllerManager.manager.containerSecurityContext | nindent 10 }}
        volumeMounts:
        - mountPath: /visibility
          name: visibility
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        - mountPath: /controller_manager_config.yaml
          name: manager-config
          subPath: controller_manager_config.yaml
        {{- if .Values.enableCertManager }}
        - mountPath: /etc/kueue/metrics/certs
          name: metrics-certs
          readOnly: true
        {{- end }}
      securityContext:
        {{- toYaml .Values.controllerManager.manager.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "kueue.fullname" . }}-controller-manager
      {{- with .Values.controllerManager.imagePullSecrets  }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.controllerManager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: visibility
        emptyDir: {}
      - name: cert
        secret:
          defaultMode: 420
          secretName: {{ include "kueue.fullname" . }}-webhook-server-cert
      - name: manager-config
        configMap:
          name: {{ include "kueue.fullname" . }}-manager-config
      {{- if .Values.enableCertManager }}
      - name: metrics-certs
        secret:
          secretName: {{ include "kueue.fullname" . }}-metrics-server-cert
          optional: false
          items:
          - key: ca.crt
            path: ca.crt
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: visibility
        secret:
          secretName: {{ include "kueue.fullname" . }}-visibility-server-cert
          optional: false
          items:
          - key: ca.crt
            path: ca.crt
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      {{- else }}
      {{- end }}
