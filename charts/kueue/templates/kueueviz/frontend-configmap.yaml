{{- if .Values.enableKueueViz }}
{{- /* With path routing the dashboard and the backend share one host, so the
       WebSocket URL is derived from that single ingress instead of the
       per-component backend ingress. */}}
{{- $ingress := .Values.kueueViz.backend.ingress }}
{{- $host := $ingress.host }}
{{- if .Values.kueueViz.ingress.enabled }}
{{- $ingress = .Values.kueueViz.ingress }}
{{- $host = $ingress.host | default "kueueviz.local" }}
{{- end }}
{{- $tlsEnabled := $ingress.tlsEnabled }}
{{- $tlsEnabledUnset := and (empty $tlsEnabled) (ne $tlsEnabled false) }}
{{- $tlsSecretName := $ingress.tlsSecretName }}
{{- $tlsSecretNameSet := empty $tlsSecretName | not }}
{{- $hasTls := or $tlsEnabled (and $tlsEnabledUnset $tlsSecretNameSet) }}
{{- $scheme := ternary "wss" "ws" $hasTls }}
{{- $backendUrl := printf "%s://%s" $scheme $host }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "kueue.fullname" . }}-kueueviz-frontend-env'
