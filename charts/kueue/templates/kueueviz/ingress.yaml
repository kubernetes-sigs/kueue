{{- if and .Values.enableKueueViz .Values.kueueViz.ingress.enabled }}
{{- $host := .Values.kueueViz.ingress.host | default "kueueviz.local" }}
{{- $backend := printf "%s-kueueviz-backend" (include "kueue.fullname" .) }}
{{- $frontend := printf "%s-kueueviz-frontend" (include "kueue.fullname" .) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- with .Values.kueueViz.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: '{{ include "kueue.fullname" . }}-kueueviz-ingress'
  namespace: '{{ .Release.Namespace }}'
spec:
  {{- $tlsEnabled := .Values.kueueViz.ingress.tlsEnabled }}
  {{- $tlsEnabledUnset := and (empty $tlsEnabled) (ne $tlsEnabled false) }}
  {{- $tlsSecretName := .Values.kueueViz.ingress.tlsSecretName }}
  {{- $tlsSecretNameSet := empty $tlsSecretName | not }}
  {{- $hasTls := or $tlsEnabled (and $tlsEnabledUnset $tlsSecretNameSet) }}
  {{- if $hasTls }}
  tls:
    - hosts:
        - '{{ $host }}'
      {{- with $tlsSecretName }}
      secretName: '{{ . }}'
      {{- end }}
  {{- end }}
  {{- if .Values.kueueViz.ingress.ingressClassName }}
  ingressClassName: {{ .Values.kueueViz.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: '{{ $host }}'
      http:
        paths:
          {{- /* Backend prefixes the browser calls: WebSockets, the resource API
                 and the auth probe. /healthz is only used by the kubelet probes,
                 so it stays off the public path. */}}
          {{- range $path := list "/ws" "/api" "/auth" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: '{{ $backend }}'
                port:
                  number: 8080
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: '{{ $frontend }}'
                port:
                  number: 8080
{{- end }}
