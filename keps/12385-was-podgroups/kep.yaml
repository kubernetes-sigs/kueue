title: Native PodGroups for Plain Pod Groups (Workload-Aware Scheduling)
kep-number: 12385
authors:
  - "@kannon92"
status: implementable
creation-date: 2026-07-17
reviewers:
  - kshalot 
  - 44past4
approvers:
  - mimowo
  - tenzen-y

# The target maturity stage in the current dev cycle for this KEP.
stage: alpha

# The most recent milestone for which work toward delivery of this KEP has been
# done. This can be the current (upcoming) milestone, if it is being actively
# worked on.
latest-milestone: "v0.20"

# The milestone at which this feature was, or is targeted to be, at each stage.
milestone:
  alpha: "v0.20"
#   beta: "v0.21"
#   stable: "v0.22"

# List the feature gate name and the components for which it must be enabled
feature-gates:
  - name: WASPodGroups

# Upstream Kubernetes prerequisites (not Kueue feature gates): this KEP
# depends on the `scheduling.k8s.io/v1beta1` Workload/PodGroup API, which
# requires the upstream `GenericWorkload` feature gate to be enabled on
# kube-apiserver (and kube-scheduler, to have the scheduler honor
# `Gang.MinCount`) starting with Kubernetes 1.37. `WASPodGroups` no-ops if
# `GenericWorkload` is off or the cluster is pre-1.37.
disable-supported: true
