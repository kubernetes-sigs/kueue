apiVersion: v1
kind: Namespace
metadata:
  name: kueue-kwok-smoke
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: kwok-smoke-flavor
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: kwok-smoke-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources:
    - cpu
    flavors:
    - name: kwok-smoke-flavor
      resources:
      - name: cpu
        nominalQuota: "1"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: kwok-smoke-queue
  namespace: kueue-kwok-smoke
spec:
  clusterQueue: kwok-smoke-cluster-queue
---
apiVersion: v1
kind: Pod
metadata:
  name: kueue-smoke
  namespace: kueue-kwok-smoke
  labels:
    kueue.x-k8s.io/managed: "true"
    kueue.x-k8s.io/queue-name: kwok-smoke-queue
  finalizers:
  - kueue.x-k8s.io/managed
spec:
  schedulingGates:
  - name: kueue.x-k8s.io/admission
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10
    resources:
      requests:
        cpu: "1"
  restartPolicy: Never
