version: 2
updates:

  # Weekly ecosystems run on different days, so their PRs don't start presubmits together.

  # Maintain Python dependencies and hashes for release scripts.
  - package-ecosystem: "pip"
    directory: "/hack/releasing"
    schedule:
      interval: "weekly"
      day: "wednesday"
    labels:
      - "ok-to-test"
      - "release-note-none"
      - "dependencies"
      - "area/dependency"

  # Maintain dependencies for go.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/hack/tools"
      - "/test/helm"
      - "/cmd/kueueviz/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
    labels:
      - "ok-to-test"
      - "release-note-none"
      - "dependencies"
      - "area/dependency"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
    ignore:
      # Ignore major and minor versions for dependencies updates
      # Allow patches and security updates.
      - dependency-name: k8s.io/*
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The site imports Docsy as a Hugo module, which go.mod marks as indirect.
  # Dependabot skips indirect Go dependencies unless they are explicitly allowed.
  - package-ecosystem: "gomod"
    directory: "/site"
    allow:
      - dependency-type: "all"
    schedule:
      interval: "weekly"
      day: "tuesday"
    labels:
      - "ok-to-test"
      - "release-note-none"
      - "dependencies"
      - "area/dependency"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "ok-to-test"
      - "release-note-none"
      - "dependencies"
      - "area/dependency"
    open-pull-requests-limit: 10
    groups:
      all:
        update-types:
          - "minor"
          - "patch"

  # Maintain Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/cmd/importer"
      - "/cmd/experimental/kueue-populator"
      - "/cmd/experimental/kueue-priority-booster"
      - "/cmd/kueueviz/backend"
      - "/cmd/kueueviz/frontend"
      - "/hack/debugpod"
      - "/hack/images/distroless"
      - "/hack/images/golang"
      - "/hack/releasing/krew-release-bot"
      - "/hack/testing/agnhost"
      - "/hack/testing/cypress"
      - "/hack/testing/depcheck"
      - "/hack/testing/linkchecker"
      - "/hack/testing/prometheus"
      - "/hack/testing/prometheus-operator"
      - "/hack/testing/ray"
      - "/hack/testing/redis"
      - "/hack/testing/shellcheck"
      - "/hack/testing/skillsaw"
      - "/hack/testing/spark"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ok-to-test"
      - "release-note-none"
      - "dependencies"
      - "area/dependency"
    groups:
      # Group Prometheus and prometheus-operator into one PR, so they bump in sync
      # instead of one lagging behind the other.
      prometheus-stack:
        patterns:
          - "quay.io/prometheus*"

  # ray-mini pip-installs Ray, which publishes wheels only, so a Python release newer
  # than Ray supports breaks the image build. Bump the Python minor version manually.
  - package-ecosystem: "docker"
    directory: "/hack/testing/ray-mini"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ok-to-test"
      - "release-note-none"
      - "dependencies"
      - "area/dependency"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directories:
      - /cmd/kueueviz/frontend
      - /site
      - /test/e2e/kueueviz
    schedule:
      interval: "weekly"
      day: "wednesday"
    labels:
      - "ok-to-test"
      - "release-note-none"
      - "dependencies"
      - "area/dependency"
    groups:
      mui-packages:
        patterns:
          - "@mui/*"
      # vite, @vitejs/*, and vitest share peer/version expectations; one PR avoids npm ERESOLVE in CI.
      vite-stack:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
      all:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@mui/*"
          - "vite"
          - "@vitejs/*"
          - "vitest"
