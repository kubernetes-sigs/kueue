  # This workflow regenerates files that depend on versions bumped by Dependabot.
  # It runs the PR's code, so it has no write access: the generated changes are
  # uploaded as patches and pushed by sync-dependabot-push.yaml.
name: Dependabot Version Sync

on:
  pull_request:
    branches: [ main ]
    # Dependabot adds labels after opening the PR, so the "opened" event has none.
    types: [ opened, synchronize, reopened, labeled ]

jobs:
    run-sync-hugo-version:
        if: >-
          ${{ contains(github.event.pull_request.labels.*.name, 'ok-to-test')
              && github.event.pull_request.user.login == 'dependabot[bot]'
              && github.actor == 'dependabot[bot]'
              && (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') }}
        runs-on: ubuntu-latest

        concurrency:
          group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
          cancel-in-progress: true

        # Permission required to edit a PR
        permissions:
          contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: 
                ref: ${{ github.event.pull_request.head.sha }}
                persist-credentials: false
            - name: Create patch directory
              run: mkdir -p "$RUNNER_TEMP/patches"
            - name: Sync hugo version
              if: ${{ contains(github.event.pull_request.title, 'hugo') }}
              run: |
                make sync-hugo-version
                git add -A
                git diff --cached --no-ext-diff --no-textconv > "$RUNNER_TEMP/patches/hugo.patch"
                git reset -q --hard
            - name: Sync controller-tools version
              if: ${{ contains(github.event.pull_request.title, 'sigs.k8s.io/controller-tools') }}
              run: |
                make manifests update-helm
                git add -A
                git diff --cached --no-ext-diff --no-textconv > "$RUNNER_TEMP/patches/controller-tools.patch"
                git reset -q --hard
            - name: Drop empty patches
              run: find "$RUNNER_TEMP/patches" -type f -empty -delete
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: dependabot-sync-patches
                path: ${{ runner.temp }}/patches
                if-no-files-found: ignore
                retention-days: 1
