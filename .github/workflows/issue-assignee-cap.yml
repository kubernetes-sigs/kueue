# This workflow enforces a maximum cap on open assigned issues for contributors.
name: Issue Assignee Cap

on:
  issues:
    types: [assigned]

permissions:
  contents: read
  issues: write

jobs:
  enforce-contributor-cap:
    if: github.repository == 'kubernetes-sigs/kueue'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check assignee role and enforce issue cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSIGNEE: ${{ github.event.assignee.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          MAX_CAP: "5"
        run: |
          set -euo pipefail

          if [[ -z "${ASSIGNEE}" ]]; then
            echo "No assignee found in event payload."
            exit 0
          fi

          ASSIGNEE_LOWER=$(echo "${ASSIGNEE}" | tr '[:upper:]' '[:lower:]')

          # 1. Parse OWNERS_ALIASES into a lookup map (alias -> users)
          declare -A ALIAS_MAP=()
          if [[ -f OWNERS_ALIASES ]]; then
            CURRENT_ALIAS=""
            while IFS= read -r line; do
              # Match alias key: "  alias_name:"
              if [[ "$line" =~ ^[[:space:]]*([a-zA-Z0-9_-]+): ]]; then
                CURRENT_ALIAS=$(echo "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              # Match alias member item: "  - username"
              elif [[ -n "$CURRENT_ALIAS" && "$line" =~ ^[[:space:]]*-[[:space:]]+([a-zA-Z0-9_-]+) ]]; then
                user=$(echo "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
                ALIAS_MAP["$CURRENT_ALIAS"]+="${user} "
              fi
            done < OWNERS_ALIASES
          fi

          # 2. Extract ONLY active approvers and reviewers from all OWNERS files (excluding emeritus)
          RAW_OWNERS=$(
            find . -name "OWNERS" \
              -not -path "./.git/*" \
              -not -path "./vendor/*" \
              -not -path "./site/*" \
              -exec awk '
                # Enter active sections
                /^[[:space:]]*(approvers|reviewers):/ { in_active = 1; next }
                # Any other top-level or new section exits active section
                /^[[:space:]]*[a-zA-Z0-9_]+:/ { in_active = 0 }
                # Match list items within active sections
                in_active && /^[[:space:]]*-[[:space:]]+[a-zA-Z0-9_-]+/ {
                  sub(/^[[:space:]]*-[[:space:]]+/, "")
                  sub(/[[:space:]]*(#.*)?$/, "")
                  print tolower($0)
                }
              ' {} + | sort -u
          )

          # 3. Resolve aliases to compile the final active privileged users list
          declare -A PRIVILEGED_MAP=()
          while IFS= read -r entry; do
            [[ -z "$entry" ]] && continue
            if [[ -n "${ALIAS_MAP[$entry]:-}" ]]; then
              for resolved_user in ${ALIAS_MAP[$entry]}; do
                PRIVILEGED_MAP["$resolved_user"]=1
              done
            else
              PRIVILEGED_MAP["$entry"]=1
            fi
          done <<< "$RAW_OWNERS"

          if [[ ${#PRIVILEGED_MAP[@]} -eq 0 ]]; then
            echo "::error::Failed to extract active approvers and reviewers from OWNERS files."
            exit 1
          fi

          # 4. Check if assignee is an active approver/reviewer
          if [[ -n "${PRIVILEGED_MAP[$ASSIGNEE_LOWER]:-}" ]]; then
            echo "User @${ASSIGNEE} is an active reviewer/approver in OWNERS. Exempt from contributor issue cap."
            exit 0
          fi

          # 5. Count open assigned issues for contributor (excluding PRs)
          OPEN_ISSUES_COUNT=$(gh api --paginate "/repos/${REPO}/issues?state=open&assignee=${ASSIGNEE}&per_page=100" \
            --jq '[.[] | select(.pull_request == null)] | length' | awk '{s+=$1} END {print s+0}')

          echo "Contributor @${ASSIGNEE} currently has ${OPEN_ISSUES_COUNT} open assigned issues (cap: ${MAX_CAP})."

          # 6. If cap is exceeded, unassign and leave explanation comment (with retries)
          if (( OPEN_ISSUES_COUNT > MAX_CAP )); then
            echo "Cap exceeded (${OPEN_ISSUES_COUNT} > ${MAX_CAP}). Unassigning @${ASSIGNEE} from issue #${ISSUE_NUMBER}."

            # Unassign with built-in retries
            gh api --method DELETE "/repos/${REPO}/issues/${ISSUE_NUMBER}/assignees" \
              -f "assignees[]=${ASSIGNEE}" \
              --retry 3

            COMMENT_BODY="@${ASSIGNEE}: Contributors are limited to a maximum of **${MAX_CAP}** open assigned issues at a time (you currently have **$((OPEN_ISSUES_COUNT - 1))** other open issues assigned).

          You have been automatically unassigned from this issue so others can work on it. Please finish or \`/unassign\` one of your existing issues before assigning a new one."

            # Post comment with retry loop
            for attempt in {1..3}; do
              if gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body "${COMMENT_BODY}"; then
                break
              fi
              echo "Retrying comment post (attempt $attempt)..."
              sleep 2
            done
          fi