# This workflow pushes the changes generated by "Dependabot Version Sync" to the
# Dependabot PR branch. It runs from the default branch and never executes code
# from the PR: it only validates the generated patches and applies them with git.
name: Dependabot Version Sync Push

on:
  workflow_run:
    workflows: [ "Dependabot Version Sync" ]
    types: [ completed ]

jobs:
  push:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.actor.login == 'dependabot[bot]'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}

    permissions:
      contents: write # push the sync commits to the PR branch
      actions: read # download the patches from the generate run
      pull-requests: read # validate the PR

    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}

    steps:
      - name: Download patches and validate the PR
        id: prepare
        run: |
          set -euo pipefail

          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "dependabot-sync-patches")] | length')
          if [ "$artifacts" -eq 0 ]; then
            echo "No generated changes to push."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::The workflow run is not linked to a pull request."
            exit 1
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          field() { jq -r "$1" <<< "$pr"; }
          if [ "$(field .user.login)" != "dependabot[bot]" ] \
            || [ "$(field .head.repo.full_name)" != "$GITHUB_REPOSITORY" ] \
            || [ "$(field .head.ref)" != "$HEAD_BRANCH" ]; then
            echo "::error::PR #$PR_NUMBER is not a Dependabot PR from a branch of this repository."
            exit 1
          fi
          if [ "$(field .state)" != "open" ] || [ "$(field .head.sha)" != "$HEAD_SHA" ]; then
            echo "::notice::PR #$PR_NUMBER is closed or has newer commits; skipping the stale sync."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/patches"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name dependabot-sync-patches --dir "$RUNNER_TEMP/patches"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate and push the generated changes
        if: ${{ steps.prepare.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail

          patch_dir="$RUNNER_TEMP/patches"
          max_patch_bytes=5242880

          git config user.name "$(git log -1 --pretty=%an)"
          git config user.email "$(git log -1 --pretty=%ae)"

          # The only change hugo sync may make is the version in netlify.toml.
          verify_hugo() {
            local normalize='s/^(  HUGO_VERSION = ).*$/\1VERSION/'
            [ "$(git show HEAD:netlify.toml | sed -E "$normalize")" = "$(sed -E "$normalize" netlify.toml)" ] \
              && grep -Eq '^  HUGO_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"$' netlify.toml
          }

          # apply_patch NAME PATH_REGEX VERIFY_FUNCTION COMMIT_MESSAGE
          # The patch comes from a job that ran PR code, so it is untrusted.
          apply_patch() {
            local name=$1 path_re=$2 verify=$3 message=$4
            local patch="$patch_dir/$name.patch"

            if [ ! -f "$patch" ]; then
              echo "No $name changes."
              return 0
            fi
            if [ "$(stat -c %s "$patch")" -gt "$max_patch_bytes" ]; then
              echo "::error::The $name patch is larger than $max_patch_bytes bytes."
              return 1
            fi

            # Only text edits to regular files: no renames, copies, mode changes or symlinks.
            local summary
            summary=$(git apply --summary "$patch")
            if printf '%s' "$summary" | grep -Ev '^ (create|delete) mode 100644 '; then
              echo "::error::The $name patch contains renames, copies or mode changes."
              return 1
            fi

            # Only allowlisted paths, and no binary changes.
            git apply --numstat -z "$patch" > "$RUNNER_TEMP/numstat"
            if [ ! -s "$RUNNER_TEMP/numstat" ]; then
              echo "::error::The $name patch changes no files."
              return 1
            fi
            local added deleted path
            while IFS=$'\t' read -r -d '' added deleted path; do
              if [ "$added" = "-" ] || [ "$deleted" = "-" ]; then
                echo "::error::The $name patch contains a binary change to $path."
                return 1
              fi
              if [[ $path == *..* ]] || ! [[ $path =~ $path_re ]]; then
                echo "::error::The $name patch changes $path, which is not allowed."
                return 1
              fi
            done < "$RUNNER_TEMP/numstat"

            git apply --index "$patch"
            if [ -n "$verify" ] && ! "$verify"; then
              echo "::error::The $name changes failed validation."
              return 1
            fi
            git commit -q -m "$message"
          }

          apply_patch hugo '^netlify\.toml$' verify_hugo "Sync hugo version"
          apply_patch controller-tools \
            '^(config/components/(crd/(alpha/)?bases|rbac|webhook)/[A-Za-z0-9._-]+\.yaml|charts/kueue/templates/[A-Za-z0-9._/-]+)$' \
            "" "Sync controller-tools version"

          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "No changes to commit"
            exit 0
          fi
          # A fast-forward push fails if the branch moved since the patches were generated.
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"