name: Unpin closed release issue

on:
  issues:
    types: [closed]

permissions: {}

jobs:
  unpin:
    if: startsWith(github.event.issue.title, 'Release v') || startsWith(github.event.issue.title, '📦 Release v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: hack/releasing
      - name: Unpin release issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: python3 hack/releasing/unpin_release_issue.py --issue-id "$ISSUE_ID"
