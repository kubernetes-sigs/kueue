name: Pin or unpin release issue

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  pin:
    if: >-
      github.event.issue.pull_request == null &&
      (startsWith(github.event.issue.title, 'Release v') || startsWith(github.event.issue.title, '📦 Release v')) &&
      (contains(github.event.comment.body, '/pin-release-issue') || contains(github.event.comment.body, '/unpin-release-issue'))
    concurrency:
      group: release-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/authorize-release-actor
            .github/actions/report-result
            hack/releasing
            OWNERS_ALIASES
      - name: Verify actor authorization
        uses: ./.github/actions/authorize-release-actor
        with:
          actor: ${{ github.actor }}
          aliases: |
            release-team
            kueue-approvers
      - name: Set release issue pin state
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          printf '%s' "$COMMENT_BODY" > comment.md
          python3 hack/releasing/release_issue_pin.py --issue-id "$ISSUE_ID" --comment-file comment.md
      - name: Mark the unpin checklist step completed
        if: steps.pin.outputs.command == 'unpin-release-issue'
        uses: ./.github/actions/report-result
        with:
          command: unpin-release-issue
          message: '✅ Release issue is unpinned.'
          mark-done: 'true'
          keep-history: 'false'
