name: Create Next Milestone
description: Creates the next minor milestone (vX.Y+1) after a major or minor release, using hack/releasing/milestone_pull.sh.

inputs:
  version:
    description: Release version, formatted as vX.Y.Z (e.g. v0.20.0)
    required: true
  repo:
    description: Target repository in owner/name format
    required: true

outputs:
  message:
    description: Human-readable result message.
    value: ${{ steps.create.outputs.message }}

runs:
  using: composite
  steps:
    - name: Create Next Milestone
      id: create
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        TARGET_REPO: ${{ inputs.repo }}
      run: |
        LOG_FILE="$(mktemp)"
        trap 'rm -f "$LOG_FILE"' EXIT

        # The repository is passed explicitly because the CI checkout has no "upstream" remote for
        # the script to read it from.
        set +e
        yes y | KUBERNETES_SIGS_KUEUE_MAIN_REPO_ORG="${TARGET_REPO%%/*}" KUBERNETES_SIGS_KUEUE_MAIN_REPO_NAME="${TARGET_REPO#*/}" \
          ./hack/releasing/milestone_pull.sh --create-milestone "$VERSION" 2>&1 | tee "$LOG_FILE"
        EXIT_CODE=${PIPESTATUS[1]}
        set -e

        MILESTONE=$(sed -n 's/^    milestone \([^ ]*\) \.* .*$/\1/p' "$LOG_FILE")
        RESULT=$(sed -n 's/^    milestone [^ ]* \.* //p' "$LOG_FILE")

        if [ "$EXIT_CODE" -ne 0 ]; then
          ERROR_LINE=$(sed -n 's/^!!! //p' "$LOG_FILE" | tail -n 1)
          echo "message=❌ ${ERROR_LINE:-Failed to create milestone \`$MILESTONE\`.}" >> "$GITHUB_OUTPUT"
          exit "$EXIT_CODE"
        fi

        case "$RESULT" in
          "created")
            MESSAGE="✅ Milestone \`$MILESTONE\` has been successfully created." ;;
          "already present")
            MESSAGE="✅ Milestone \`$MILESTONE\` already exists." ;;
          "already present (closed, left as-is)")
            MESSAGE="✅ Milestone \`$MILESTONE\` already exists (closed, left as-is)." ;;
          *)
            MESSAGE="✅ Milestone \`$MILESTONE\`: $RESULT." ;;
        esac
        echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
