apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: default
  name: a100-or-mig
spec:
  spec:
    devices:
      requests:
      - name: gpu
        firstAvailable:
        - name: a100
          deviceClassName: a100.example.com
        - name: mig
          deviceClassName: a100-mig.example.com
---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: sample-dra-firstavailable-job-
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  template:
    spec:
      containers:
      - name: dummy-job
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["pause"]
        resources:
          claims:
          - name: gpu
          requests:
            cpu: "1"
            memory: "200Mi"
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: a100-or-mig
      restartPolicy: Never
