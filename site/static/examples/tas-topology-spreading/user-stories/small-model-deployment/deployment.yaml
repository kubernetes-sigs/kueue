# KEP-13746 Story 1: serving a small AI inference model with multiple replicas.
#
# The model fits in a single Pod, so a Deployment is used and Kueue creates one
# Workload per Pod. A zone may already hold at most 45% of those Workloads for
# the next one to still be placed there.
#
# Fix applied vs. the KEP story: added `podset-required-topology`. The
# implementation counts a PodSet group as occupying exactly one domain per rule
# level, which only holds when TAS placement is required, so the spreading
# annotation is rejected without it. It names the same level as the rule, which
# is what a single-Pod PodSet wants anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-inference-service
  namespace: story-small-model
  labels:
    kueue.x-k8s.io/queue-name: tas-user-queue
spec:
  replicas: 6
  selector:
    matchLabels:
      app: main-inference-service
  template:
    metadata:
      labels:
        # Copied onto every Workload via integrations.labelKeysToCopy; this is
        # what workloadLabelSelectors below matches on.
        app: main-inference-service
      annotations:
        kueue.x-k8s.io/podset-required-topology: "topology.kubernetes.io/zone"
        kueue.x-k8s.io/podset-topology-spreading: |
          {
            "workloadLabelSelectors": [{"key": "app", "operator": "In", "values": ["main-inference-service"]}],
            "rules": [
              {"topologyKey": "topology.kubernetes.io/zone", "maxShareAllowingPlacement": "0.45"}
            ]
          }
    spec:
      containers:
        - name: server
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["pause"]
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
