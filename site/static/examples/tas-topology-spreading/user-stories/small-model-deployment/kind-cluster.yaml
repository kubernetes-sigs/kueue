# Three zoned workers, one node per zone, so the zone level of the Topology in
# sample-queues.yaml has three domains to spread across.
#
#   kind create cluster --config kind-cluster.yaml
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tas-spreading-small-model
nodes:
  - role: control-plane
  - role: worker
    labels:
      cloud.provider.com/node-group: tas-group
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      cloud.provider.com/node-group: tas-group
      topology.kubernetes.io/zone: zone-b
  - role: worker
    labels:
      cloud.provider.com/node-group: tas-group
      topology.kubernetes.io/zone: zone-c
