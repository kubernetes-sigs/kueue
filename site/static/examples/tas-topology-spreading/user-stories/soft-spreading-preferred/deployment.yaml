# KEP-13746 Story 4: soft spreading with limited capacity.
#
# The operator prefers zone spreading but accepts that capacity may not allow it,
# so the rule is `enforcementMode: Preferred`. Zones already over 45% are
# deprioritized in the placement ordering but stay eligible, and a replica
# admitted into a crowded zone gets no spreading-related condition - Preferred
# semantics allow exactly that.
#
# The cluster in kind-cluster.yaml has only two zones on purpose, which is one
# fewer than a 0.45 share allows to be reused. From the third replica on, every
# zone is over the threshold: Preferred keeps admitting, Required would not.
#
# Fixes applied vs. the KEP story:
#   1. Added `workloadLabelSelectors`. The story omits it and relies on the KEP's
#      mutating-webhook `job-uid` default; the implementation has no such
#      injection and rejects a missing selector. The job-uid default would not
#      have worked for a Deployment anyway - each Pod is its own Workload with
#      its own UID, so it would only ever match the Workload being placed.
#   2. Added `podset-required-topology`, as in ../small-model-deployment/ - the
#      spreading annotation is rejected without it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-inference-service
  namespace: story-soft-spreading
  labels:
    kueue.x-k8s.io/queue-name: tas-user-queue
spec:
  replicas: 6
  selector:
    matchLabels:
      app: main-inference-service
  template:
    metadata:
      labels:
        app: main-inference-service
      annotations:
        kueue.x-k8s.io/podset-required-topology: "topology.kubernetes.io/zone"
        kueue.x-k8s.io/podset-topology-spreading: |
          {
            "workloadLabelSelectors": [{"key": "app", "operator": "In", "values": ["main-inference-service"]}],
            "rules": [
              {"topologyKey": "topology.kubernetes.io/zone", "maxShareAllowingPlacement": "0.45", "enforcementMode": "Preferred"}
            ]
          }
    spec:
      containers:
        - name: server
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["pause"]
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
