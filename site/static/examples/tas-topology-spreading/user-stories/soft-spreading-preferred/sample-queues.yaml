---
apiVersion: v1
kind: Namespace
metadata:
  name: story-soft-spreading
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: "zones"
spec:
  levels:
    # One level, exactly the level this story's spreading rule names. The KEP
    # stories say nothing about a kubernetes.io/hostname level and none is
    # needed: spreading resolves an assignment through the topology tree, so it
    # works whether or not the Topology declares one.
    - nodeLabel: "topology.kubernetes.io/zone"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: "tas-flavor"
spec:
  nodeLabels:
    cloud.provider.com/node-group: "tas-group"
  topologyName: "zones"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: "tas-cluster-queue"
spec:
  namespaceSelector: {} # match all.
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: "tas-flavor"
          resources:
            - name: "cpu"
              nominalQuota: 100
            - name: "memory"
              nominalQuota: 100Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: "story-soft-spreading"
  name: "tas-user-queue"
spec:
  clusterQueue: "tas-cluster-queue"
