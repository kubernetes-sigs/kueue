# Three racks, one node per rack, so the rack level of the Topology in
# sample-queues.yaml has three domains to spread the replica groups across.
# Each rack must fit a whole leader+worker group (size 2 below).
#
#   kind create cluster --config kind-cluster.yaml
---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tas-spreading-large-lws
nodes:
  - role: control-plane
  - role: worker
    labels:
      cloud.provider.com/node-group: tas-group
      cloud.provider.com/rack: rack-a
  - role: worker
    labels:
      cloud.provider.com/node-group: tas-group
      cloud.provider.com/rack: rack-b
  - role: worker
    labels:
      cloud.provider.com/node-group: tas-group
      cloud.provider.com/rack: rack-c
