# Fragment to merge into the cluster's existing kueue-manager-config ConfigMap.
# It is NOT a standalone Configuration to apply as-is (see the README).
#
# featureGates: topology spreading is alpha and off by default; it also depends
# on TopologyAwareScheduling, which the controller refuses to start without.
#
# No integrations.labelKeysToCopy is needed for this story. It exists to
# propagate a job's own labels onto the Workload for an explicit
# workloadLabelSelectors to match; this story omits the selector and relies on
# the `kueue.x-k8s.io/job-uid` default instead, and Kueue sets that label on
# every Workload itself. The stories with an explicit selector
# (../small-model-deployment/, ../large-model-podgroup/,
# ../soft-spreading-preferred/) do need the key.
featureGates:
  TopologyAwareScheduling: true
  TASTopologySpreading: true
