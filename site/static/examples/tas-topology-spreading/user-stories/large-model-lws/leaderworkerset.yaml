# KEP-13746 Story 2: serving a large AI inference model with multiple replicas.
#
# The model needs several closely connected Pods, so one LeaderWorkerSet group is
# one replica. Each group lands in a single rack, and a rack may already hold at
# most 45% of the groups for the next one to be placed there.
#
# No `workloadLabelSelectors`: omitting it is what asks for the default, and the
# Workload mutating webhook injects
# `[{"key": "kueue.x-k8s.io/job-uid", "operator": "In", "values": ["<lws-uid>"]}]`
# before the Workload is stored. The LWS reconciler labels every group's Workload
# with the *LeaderWorkerSet's* UID rather than the Pod's, so all six groups share
# one value and spread against each other with no label to propagate. Contrast
# ../small-model-deployment/ and ../soft-spreading-preferred/, where each Pod is
# its own Workload with its own UID, so the default would match only the group
# being placed and an explicit selector is required.
#
# `kueue.x-k8s.io/podset-group-name` is load-bearing: it makes leader and worker
# one spreading unit, counted once per replica rather than twice. It must be the
# same value for every replica - it comes from the shared template, so it is.
# Contrast ../large-model-podgroup/, where a per-replica group name is the bug.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: large-inference-service
  namespace: story-large-lws
  labels:
    kueue.x-k8s.io/queue-name: tas-user-queue
spec:
  replicas: 6
  leaderWorkerTemplate:
    size: 2
    leaderTemplate:
      metadata:
        annotations:
          kueue.x-k8s.io/podset-required-topology: "cloud.provider.com/rack"
          kueue.x-k8s.io/podset-group-name: "replica-group"
          kueue.x-k8s.io/podset-topology-spreading: |
            {
              "rules": [
                {"topologyKey": "cloud.provider.com/rack", "maxShareAllowingPlacement": "0.45"}
              ]
            }
      spec:
        containers:
          - name: leader
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["pause"]
            resources:
              requests:
                cpu: "10m"
                memory: "64Mi"
    workerTemplate:
      metadata:
        annotations:
          kueue.x-k8s.io/podset-required-topology: "cloud.provider.com/rack"
          kueue.x-k8s.io/podset-group-name: "replica-group"
          # Every PodSet in a group must carry the same spreading annotation, or
          # none may, so this repeats the leader's verbatim. The webhook defaults
          # both to the same job UID, so they stay identical afterwards too.
          kueue.x-k8s.io/podset-topology-spreading: |
            {
              "rules": [
                {"topologyKey": "cloud.provider.com/rack", "maxShareAllowingPlacement": "0.45"}
              ]
            }
      spec:
        containers:
          - name: worker
            image: registry.k8s.io/e2e-test-images/agnhost:2.53
            args: ["pause"]
            resources:
              requests:
                cpu: "10m"
                memory: "64Mi"
