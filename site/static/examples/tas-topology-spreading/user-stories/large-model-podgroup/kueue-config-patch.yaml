# Fragment to merge into the cluster's existing kueue-manager-config ConfigMap.
# It is NOT a standalone Configuration to apply as-is (see the README).
#
# featureGates: topology spreading is alpha and off by default; it also depends
# on TopologyAwareScheduling, which the controller refuses to start without.
#
# labelKeysToCopy: Kueue copies a job's labels onto the Workload it creates only
# for keys listed here. For a Pod group the labels are copied from the Pods
# themselves, so the "app" label belongs on every Pod. Without this key the
# label never reaches the Workload, workloadLabelSelectors matches zero
# Workloads, and spreading is silently inert.
#
# The `pod` integration is enabled by default and these Pods opt in explicitly
# via the kueue.x-k8s.io/queue-name label, so no namespace selector change is
# needed.
featureGates:
  TopologyAwareScheduling: true
  TASTopologySpreading: true
integrations:
  labelKeysToCopy:
    - "app"
