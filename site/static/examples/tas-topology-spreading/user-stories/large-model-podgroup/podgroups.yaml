# KEP-13746 Story 3: serving a large AI inference model using plain Pod groups.
#
# An in-house Pod management system integrates with Kueue via Pod groups; one
# group is one model replica. A rack may already hold at most 34% of the groups
# for the next one to be placed there, so each of the three groups opens its own
# rack.
#
# Fixes applied vs. the KEP story - see the README for the full reasoning:
#   1. REMOVED `kueue.x-k8s.io/podset-group-name`. The story sets it to the
#      per-replica group name, which gives every replica a distinct spreading
#      key, so no replica ever counts another and all of them pile into one
#      rack - accepted with no error, no condition, no log.
#   2. Added the `kueue.x-k8s.io/queue-name` label, omitted by the story.
#
# The Pods' `kueue.x-k8s.io/pod-group-name` LABEL stays per-replica: that is a
# different annotation and it is what separates the replicas' Workloads.
#
# All six Pod specs are deliberately identical: with no podset-group-name the
# spreading key falls back to the PodSet name, which for a Pod group is the hash
# of the Pod's resource/scheduling shape. A divergent shape would split the
# replicas into separate spreading groups exactly as the group name did.
---
apiVersion: v1
kind: Pod
metadata:
  name: large-inference-service-0-a
  namespace: story-large-podgroup
  labels:
    kueue.x-k8s.io/queue-name: tas-user-queue
    kueue.x-k8s.io/pod-group-name: large-inference-service-0
    app: large-inference-service
  annotations:
    kueue.x-k8s.io/pod-group-total-count: "2"
    kueue.x-k8s.io/podset-required-topology: "cloud.provider.com/rack"
    kueue.x-k8s.io/podset-topology-spreading: |
      {
        "workloadLabelSelectors": [{"key": "app", "operator": "In", "values": ["large-inference-service"]}],
        "rules": [
          {"topologyKey": "cloud.provider.com/rack", "maxShareAllowingPlacement": "0.34"}
        ]
      }
spec:
  restartPolicy: Never
  containers:
    - name: replica
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
      resources:
        requests:
          cpu: "10m"
          memory: "64Mi"
