apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: tas-sample-topology-spreading
  labels:
    kueue.x-k8s.io/queue-name: tas-user-queue
spec:
  replicas: 6
  leaderWorkerTemplate:
    size: 2
    leaderTemplate:
      metadata:
        annotations:
          # Engage TAS: the whole replica group (leader+worker) must land in
          # one zone.
          kueue.x-k8s.io/podset-required-topology: "topology.kubernetes.io/zone"
          # Group leader+worker into a single spreading unit.
          kueue.x-k8s.io/podset-group-name: "replica-group"
          # Spread replica groups across zones: a zone may hold at most 34% of
          # the matching Workloads for the next group to still be placed there.
          #
          # No workloadLabelSelectors: omitting it asks for the default, and
          # the Workload mutating webhook injects
          # [{"key": "kueue.x-k8s.io/job-uid", "operator": "In", "values": ["<lws-uid>"]}]
          # before the Workload is stored. The LWS reconciler labels every
          # group's Workload with the LeaderWorkerSet's own UID, so all six
          # groups share one value and spread against each other - no label to
          # propagate and no integrations.labelKeysToCopy needed.
          kueue.x-k8s.io/podset-topology-spreading: |
            {
              "rules": [
                {"topologyKey": "topology.kubernetes.io/zone", "maxShareAllowingPlacement": "0.34", "enforcementMode": "Required"}
              ]
            }
      spec:
        containers:
        - name: leader
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["pause"]
          resources:
            requests:
              cpu: "10m"
    workerTemplate:
      metadata:
        annotations:
          kueue.x-k8s.io/podset-required-topology: "topology.kubernetes.io/zone"
          kueue.x-k8s.io/podset-group-name: "replica-group"
          # Every PodSet in a group must carry the same spreading annotation
          # (or none may), so this repeats the leader's verbatim. The webhook
          # defaults both to the same job UID, so they stay identical after
          # injection too.
          kueue.x-k8s.io/podset-topology-spreading: |
            {
              "rules": [
                {"topologyKey": "topology.kubernetes.io/zone", "maxShareAllowingPlacement": "0.34", "enforcementMode": "Required"}
              ]
            }
      spec:
        containers:
        - name: worker
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["pause"]
          resources:
            requests:
              cpu: "10m"
